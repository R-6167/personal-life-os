name: CI

on:
  push:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Prefer lockfile when present (commit apps/flutter/pubspec.lock to clear Sonar S4790).
      - name: Get dependencies
        run: |
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            echo "::warning::pubspec.lock missing — run flutter pub get locally and commit the lockfile"
            flutter pub get
          fi

      - name: Unit, smoke & integration tests
        run: flutter test --reporter expanded

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          CODE=${PIPESTATUS[0]}
          echo "analyze exit=$CODE"
          if [ "$CODE" != "0" ]; then
            echo "::error::flutter analyze failed"
            grep -E "error •|Error:" /tmp/analyze.txt || true
            exit "$CODE"
          fi

      - name: Atomic write pattern scan
        run: |
          echo "Scanning for AtomicWrite usage..."
          grep -Rn "AtomicWrite\." lib/data || true
          echo "Scanning txn usage..."
          grep -Rn "\.txn(\|db\.transaction\|AtomicWrite" lib/data | head -40
          echo "Pattern scan complete"
