name: WaveB life areas schema v25
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase-3-life-areas
      - name: Add life_areas table and v25 migration
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          schema = Path('apps/flutter/assets/schema.sql')
          sql = schema.read_text()
          table = (
              "CREATE TABLE IF NOT EXISTS life_areas (\n"
              "  id TEXT PRIMARY KEY, owner_id TEXT NOT NULL, title TEXT NOT NULL,\n"
              "  description TEXT, color TEXT, icon TEXT,\n"
              "  position INTEGER DEFAULT 0, archived_at INTEGER,\n"
              "  created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL,\n"
              "  FOREIGN KEY(owner_id) REFERENCES users(id) ON DELETE CASCADE\n"
              ");\n\n"
          )
          if 'CREATE TABLE IF NOT EXISTS life_areas' not in sql:
              needle = 'CREATE TABLE IF NOT EXISTS people ('
              assert needle in sql
              sql = sql.replace(needle, table + needle, 1)
              sql = sql.replace(
                  'description TEXT, status TEXT, created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL,\n  FOREIGN KEY(owner_id) REFERENCES users(id) ON DELETE CASCADE\n);\n\nCREATE TABLE IF NOT EXISTS projects (',
                  'description TEXT, status TEXT, life_area_id TEXT,\n  created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL,\n  FOREIGN KEY(owner_id) REFERENCES users(id) ON DELETE CASCADE\n);\n\nCREATE TABLE IF NOT EXISTS projects (',
                  1,
              )
              sql = sql.replace(
                  'goal_id TEXT, title TEXT NOT NULL,\n  status TEXT, created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL,\n  FOREIGN KEY(owner_id) REFERENCES users(id) ON DELETE CASCADE\n);\n\nCREATE TABLE IF NOT EXISTS milestones (',
                  'goal_id TEXT, title TEXT NOT NULL,\n  status TEXT, life_area_id TEXT,\n  created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL,\n  FOREIGN KEY(owner_id) REFERENCES users(id) ON DELETE CASCADE\n);\n\nCREATE TABLE IF NOT EXISTS milestones (',
                  1,
              )
              sql = sql.replace(
                  'milestone_id TEXT, parent_task_id TEXT, title TEXT NOT NULL, description TEXT,\n  status TEXT, priority INTEGER DEFAULT 0, due_at INTEGER,',
                  'milestone_id TEXT, parent_task_id TEXT, life_area_id TEXT,\n  title TEXT NOT NULL, description TEXT,\n  status TEXT, priority INTEGER DEFAULT 0, due_at INTEGER,',
                  1,
              )
              schema.write_text(sql)
              print('schema updated')
          else:
              print('schema already has life_areas')

          db = Path('apps/flutter/lib/data/database.dart')
          src = db.read_text()
          src = src.replace('static const schemaVersion = 24;', 'static const schemaVersion = 25;')
          if '_migrateToV25' not in src:
              src = src.replace(
                  '        await _migrateToV24(db);\n        await _verifySchemaContract(db);',
                  '        await _migrateToV24(db);\n        await _migrateToV25(db);\n        await _verifySchemaContract(db);',
                  1,
              )
              src = src.replace(
                  '        if (oldVersion < 24) await _migrateToV24(db);\n        await _verifySchemaContract(db);',
                  '        if (oldVersion < 24) await _migrateToV24(db);\n        if (oldVersion < 25) await _migrateToV25(db);\n        await _verifySchemaContract(db);',
                  1,
              )
              method_lines = [
                  '  Future<void> _migrateToV25(Database db) async {',
                  "    await db.execute('''",
                  'CREATE TABLE IF NOT EXISTS life_areas (',
                  '  id TEXT PRIMARY KEY, owner_id TEXT NOT NULL, title TEXT NOT NULL,',
                  '  description TEXT, color TEXT, icon TEXT,',
                  '  position INTEGER DEFAULT 0, archived_at INTEGER,',
                  '  created_at INTEGER NOT NULL, updated_at INTEGER NOT NULL,',
                  '  FOREIGN KEY(owner_id) REFERENCES users(id) ON DELETE CASCADE',
                  ')',
                  "    ''');",
                  "    await _executeIgnoringDuplicateColumn(db, 'ALTER TABLE goals ADD COLUMN life_area_id TEXT');",
                  "    await _executeIgnoringDuplicateColumn(db, 'ALTER TABLE projects ADD COLUMN life_area_id TEXT');",
                  "    await _executeIgnoringDuplicateColumn(db, 'ALTER TABLE tasks ADD COLUMN life_area_id TEXT');",
                  '  }',
                  '',
              ]
              method = '\n'.join(method_lines) + '\n'
              src = src.replace(
                  '  Future<void> _migrateToV24(Database db) async {',
                  method + '  Future<void> _migrateToV24(Database db) async {',
                  1,
              )
          if "'life_areas'" not in src:
              src = src.replace(
                  "      'users', 'goals', 'projects', 'tasks', 'activity_events',",
                  "      'users', 'goals', 'projects', 'tasks', 'life_areas', 'activity_events',",
              )
          db.write_text(src)
          print('database ok', 'schemaVersion = 25' in src, '_migrateToV25' in src)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/assets/schema.sql apps/flutter/lib/data/database.dart
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "feat(phase-3): schema v25 life_areas + life_area_id on goals/projects/tasks"
          git push origin HEAD:feat/phase-3-life-areas
