name: WaveB life area wiring
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase-3-life-area-wiring
      - name: Wire lifeAreaId + LifeHub entry
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # --- models.dart: Goal ---
          m = Path('apps/flutter/lib/domain/models.dart')
          src = m.read_text()
          if 'lifeAreaId' not in src:
              src = src.replace(
                  '''class Goal {
            final String id;
            final String ownerId;
            final String title;
            final String status;
            final int priority;
            final int createdAt;
            final int updatedAt;

            const Goal({
              required this.id,
              required this.ownerId,
              required this.title,
              required this.status,
              this.priority = 0,
              required this.createdAt,
              required this.updatedAt,
            });

            factory Goal.fromMap(Map<String, Object?> m) => Goal(
                  id: dbStr(m['id']),
                  ownerId: dbStr(m['owner_id']),
                  title: dbStr(m['title']),
                  status: dbStr(m['status'], 'ACTIVE'),
                  priority: dbIntOr(m['priority']),
                  createdAt: dbIntOr(m['created_at']),
                  updatedAt: dbIntOr(m['updated_at']),
                );

            /// Columns that exist in schema.sql only.
            Map<String, Object?> toInsertMap() => {
                  'id': id,
                  'owner_id': ownerId,
                  'title': title,
                  'status': status,
                  'created_at': createdAt,
                  'updated_at': updatedAt,
                };
          }''',
                  '''class Goal {
            final String id;
            final String ownerId;
            final String title;
            final String status;
            final int priority;
            final String? lifeAreaId;
            final int createdAt;
            final int updatedAt;

            const Goal({
              required this.id,
              required this.ownerId,
              required this.title,
              required this.status,
              this.priority = 0,
              this.lifeAreaId,
              required this.createdAt,
              required this.updatedAt,
            });

            factory Goal.fromMap(Map<String, Object?> m) => Goal(
                  id: dbStr(m['id']),
                  ownerId: dbStr(m['owner_id']),
                  title: dbStr(m['title']),
                  status: dbStr(m['status'], 'ACTIVE'),
                  priority: dbIntOr(m['priority']),
                  lifeAreaId: dbStrOrNull(m['life_area_id']),
                  createdAt: dbIntOr(m['created_at']),
                  updatedAt: dbIntOr(m['updated_at']),
                );

            /// Columns that exist in schema.sql only.
            Map<String, Object?> toInsertMap() => {
                  'id': id,
                  'owner_id': ownerId,
                  'title': title,
                  'status': status,
                  'life_area_id': lifeAreaId,
                  'created_at': createdAt,
                  'updated_at': updatedAt,
                };
          }''',
              )
              # Project
              src = src.replace(
                  '''class Project {
            final String id;
            final String ownerId;
            final String? goalId;
            final String title;
            final String status;
            final int priority;
            final int createdAt;
            final int updatedAt;

            const Project({
              required this.id,
              required this.ownerId,
              this.goalId,
              required this.title,
              required this.status,
              this.priority = 0,
              required this.createdAt,
              required this.updatedAt,
            });

            factory Project.fromMap(Map<String, Object?> m) => Project(
                  id: dbStr(m['id']),
                  ownerId: dbStr(m['owner_id']),
                  goalId: dbStrOrNull(m['goal_id']),
                  title: dbStr(m['title']),
                  status: dbStr(m['status'], 'ACTIVE'),
                  priority: dbIntOr(m['priority']),
                  createdAt: dbIntOr(m['created_at']),
                  updatedAt: dbIntOr(m['updated_at']),
                );

            Map<String, Object?> toInsertMap() => {
                  'id': id,
                  'owner_id': ownerId,
                  'goal_id': goalId,
                  'title': title,
                  'status': status,
                  'created_at': createdAt,
                  'updated_at': updatedAt,
                };
          }''',
                  '''class Project {
            final String id;
            final String ownerId;
            final String? goalId;
            final String title;
            final String status;
            final int priority;
            final String? lifeAreaId;
            final int createdAt;
            final int updatedAt;

            const Project({
              required this.id,
              required this.ownerId,
              this.goalId,
              required this.title,
              required this.status,
              this.priority = 0,
              this.lifeAreaId,
              required this.createdAt,
              required this.updatedAt,
            });

            factory Project.fromMap(Map<String, Object?> m) => Project(
                  id: dbStr(m['id']),
                  ownerId: dbStr(m['owner_id']),
                  goalId: dbStrOrNull(m['goal_id']),
                  title: dbStr(m['title']),
                  status: dbStr(m['status'], 'ACTIVE'),
                  priority: dbIntOr(m['priority']),
                  lifeAreaId: dbStrOrNull(m['life_area_id']),
                  createdAt: dbIntOr(m['created_at']),
                  updatedAt: dbIntOr(m['updated_at']),
                );

            Map<String, Object?> toInsertMap() => {
                  'id': id,
                  'owner_id': ownerId,
                  'goal_id': goalId,
                  'title': title,
                  'status': status,
                  'life_area_id': lifeAreaId,
                  'created_at': createdAt,
                  'updated_at': updatedAt,
                };
          }''',
              )
              # Task - add field after goalId
              src = src.replace(
                  '  final String? projectId;\n  final String? goalId;\n  final String title;',
                  '  final String? projectId;\n  final String? goalId;\n  final String? lifeAreaId;\n  final String title;',
                  1,
              )
              src = src.replace(
                  '    this.projectId,\n    this.goalId,\n    required this.title,',
                  '    this.projectId,\n    this.goalId,\n    this.lifeAreaId,\n    required this.title,',
                  1,
              )
              src = src.replace(
                  "        goalId: dbStrOrNull(m['goal_id']),\n        title: dbStr(m['title']),",
                  "        goalId: dbStrOrNull(m['goal_id']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        title: dbStr(m['title']),",
                  1,
              )
              # Task toInsertMap - find and add life_area_id if present pattern
              if "'life_area_id': lifeAreaId" not in src or src.count("'life_area_id': lifeAreaId") < 3:
                  # Goal and Project already have it; Task map
                  src = src.replace(
                      "        'goal_id': goalId,\n        'title': title,\n        'status': status,\n        'priority': priority,",
                      "        'goal_id': goalId,\n        'life_area_id': lifeAreaId,\n        'title': title,\n        'status': status,\n        'priority': priority,",
                      1,
                  )
              m.write_text(src)
              print('models updated', src.count('lifeAreaId'))
          else:
              print('models already have lifeAreaId')

          # --- goal_repository create ---
          gr = Path('apps/flutter/lib/data/goal_repository.dart')
          gs = gr.read_text()
          if 'lifeAreaId' not in gs:
              gs = gs.replace(
                  'Future<Goal> create({\n    required String title, String? description, int? targetDate, int priority = 0}) async {',
                  'Future<Goal> create({\n    required String title, String? description, int? targetDate, int priority = 0, String? lifeAreaId}) async {',
              )
              gs = gs.replace(
                  '''    final goal = Goal(
          id: AppDatabase.newId(),
          ownerId: ownerId,
          title: title.trim(),
          status: EntityStatus.active,
          priority: priority,
          createdAt: now,
          updatedAt: now,
        );''',
                  '''    final goal = Goal(
          id: AppDatabase.newId(),
          ownerId: ownerId,
          title: title.trim(),
          status: EntityStatus.active,
          priority: priority,
          lifeAreaId: lifeAreaId,
          createdAt: now,
          updatedAt: now,
        );''',
              )
              gr.write_text(gs)
              print('goal repo updated')

          # --- project_repository create ---
          pr = Path('apps/flutter/lib/data/project_repository.dart')
          ps = pr.read_text()
          if 'lifeAreaId' not in ps:
              ps = ps.replace(
                  'Future<Project> create({required String title, String? description, String? goalId}) async {',
                  'Future<Project> create({required String title, String? description, String? goalId, String? lifeAreaId}) async {',
              )
              ps = ps.replace(
                  '''    final project = Project(
          id: AppDatabase.newId(),
          ownerId: ownerId,
          goalId: goalId,
          title: title.trim(),
          status: EntityStatus.active,
          createdAt: now,
          updatedAt: now,
        );''',
                  '''    final project = Project(
          id: AppDatabase.newId(),
          ownerId: ownerId,
          goalId: goalId,
          title: title.trim(),
          status: EntityStatus.active,
          lifeAreaId: lifeAreaId,
          createdAt: now,
          updatedAt: now,
        );''',
              )
              pr.write_text(ps)
              print('project repo updated')

          # --- task_repository create ---
          tr = Path('apps/flutter/lib/data/task_repository.dart')
          ts = tr.read_text()
          if 'String? lifeAreaId' not in ts:
              ts = ts.replace(
                  '    String? parentTaskId,\n    String? assistantActionPreview,\n  }) async {',
                  '    String? parentTaskId,\n    String? lifeAreaId,\n    String? assistantActionPreview,\n  }) async {',
              )
              ts = ts.replace(
                  '''    final task = Task(
          id: AppDatabase.newId(),
          ownerId: ownerId,
          projectId: projectId,
          goalId: goalId,
          title: title,
          status: status,
          priority: priority,
          dueAt: dueAt,
          createdAt: now,
          updatedAt: now,
        );''',
                  '''    final task = Task(
          id: AppDatabase.newId(),
          ownerId: ownerId,
          projectId: projectId,
          goalId: goalId,
          lifeAreaId: lifeAreaId,
          title: title,
          status: status,
          priority: priority,
          dueAt: dueAt,
          createdAt: now,
          updatedAt: now,
        );''',
              )
              tr.write_text(ts)
              print('task repo updated')

          # --- life_hub entry ---
          hub = Path('apps/flutter/lib/ui/hubs/life_hub.dart')
          hs = hub.read_text()
          if 'LifeAreasScreen' not in hs:
              hs = hs.replace(
                  "import '../screens/wellness_screen.dart';",
                  "import '../screens/life_areas_screen.dart';\nimport '../screens/wellness_screen.dart';",
              )
              # Insert nav card after first _navCard or near top of build children
              marker = "_navCard(\n            icon: Icons.spa,"
              # try wellness
              insert = (
                  "_navCard(\n"
                  "            icon: Icons.category_outlined,\n"
                  "            title: 'Life areas',\n"
                  "            subtitle: 'Configure domains of life',\n"
                  "            onTap: () {\n"
                  "              Navigator.of(context).push(\n"
                  "                MaterialPageRoute(builder: (_) => const LifeAreasScreen()),\n"
                  "              );\n"
                  "            },\n"
                  "          ),\n"
                  "          "
              )
              if 'Icons.spa' in hs:
                  idx = hs.find('_navCard(\n            icon: Icons.spa')
                  if idx < 0:
                      idx = hs.find('icon: Icons.spa')
                      # find start of _navCard before it
                      idx = hs.rfind('_navCard(', 0, idx)
                  if idx >= 0:
                      hs = hs[:idx] + insert + hs[idx:]
                  else:
                      raise SystemExit('spa nav not found')
              else:
                  # after first _navCard block start of column children
                  idx = hs.find('children: [')
                  if idx < 0:
                      raise SystemExit('children not found')
                  # find first _navCard after children
                  j = hs.find('_navCard(', idx)
                  hs = hs[:j] + insert + hs[j:]
              hub.write_text(hs)
              print('life hub updated')
          else:
              print('life hub already has LifeAreasScreen')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "feat(phase-3): wire lifeAreaId on models/repos + LifeHub entry"
          git push origin HEAD:feat/phase-3-life-area-wiring
