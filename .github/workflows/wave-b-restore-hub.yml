name: WaveB restore hub and models
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase-3-life-area-wiring
      - name: Fix models and life_hub
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import urllib.request

          mp = Path('apps/flutter/lib/domain/models.dart')
          m = mp.read_text()
          # Remove duplicate lifeAreaId line in Project.fromMap
          m = m.replace(
              "lifeAreaId: dbStrOrNull(m['life_area_id']),\n        title: dbStr(m['title']),\n        status: dbStr(m['status'], 'ACTIVE'),\n        priority: dbIntOr(m['priority']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n",
              "title: dbStr(m['title']),\n        status: dbStr(m['status'], 'ACTIVE'),\n        priority: dbIntOr(m['priority']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n",
              1,
          )
          # Task.fromMap missing lifeAreaId
          if "goalId: dbStrOrNull(m['goal_id']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        title: dbStr(m['title'])," not in m:
              m = m.replace(
                  "projectId: dbStrOrNull(m['project_id']),\n        goalId: dbStrOrNull(m['goal_id']),\n        title: dbStr(m['title']),",
                  "projectId: dbStrOrNull(m['project_id']),\n        goalId: dbStrOrNull(m['goal_id']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        title: dbStr(m['title']),",
                  1,
              )
          mp.write_text(m)
          proj = m.split('class Project')[1].split('class Milestone')[0]
          assert proj.count("lifeAreaId: dbStrOrNull") == 1
          print('models ok')

          hub = Path('apps/flutter/lib/ui/hubs/life_hub.dart')
          hs = urllib.request.urlopen(
              'https://raw.githubusercontent.com/R-6167/personal-life-os/main/apps/flutter/lib/ui/hubs/life_hub.dart'
          ).read().decode()
          if "import '../screens/life_areas_screen.dart';" not in hs:
              hs = hs.replace(
                  "import '../screens/wellness_screen.dart';",
                  "import '../screens/life_areas_screen.dart';\nimport '../screens/wellness_screen.dart';",
              )
          if 'Icons.category_outlined' not in hs:
              card = (
                  "        _navCard(\n"
                  "          icon: Icons.category_outlined,\n"
                  "          title: 'Life areas',\n"
                  "          subtitle: 'Configure domains of life',\n"
                  "          onTap: () {\n"
                  "            Navigator.of(context).push(\n"
                  "              MaterialPageRoute(builder: (_) => const LifeAreasScreen()),\n"
                  "            );\n"
                  "          },\n"
                  "        ),\n"
              )
              marker = (
                  "      children: [\n"
                  "        _navCard(\n"
                  "          icon: Icons.priority_high,"
              )
              assert marker in hs, 'marker missing'
              hs = hs.replace(
                  marker,
                  "      children: [\n" + card + "        _navCard(\n          icon: Icons.priority_high,",
                  1,
              )
          assert hs.count('Widget _navCard(') == 1
          assert 'Icons.category_outlined' in hs
          hub.write_text(hs)
          print('hub ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/domain/models.dart apps/flutter/lib/ui/hubs/life_hub.dart
          git diff --cached --stat
          git commit -m "fix(phase-3): models lifeAreaId dup + restore LifeHub nav card" || echo nochange
          git push origin HEAD:feat/phase-3-life-area-wiring
