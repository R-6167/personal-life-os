name: Cleanup temp workflows
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/cleanup-temp-workflows
      - name: Remove wave-a and wave-b temp workflows; fix project open
        run: |
          set -euo pipefail
          cd .github/workflows
          rm -f wave-a-*.yml wave-b-*.yml
          ls -la
          cd ../..
          python3 << 'PY'
          from pathlib import Path
          p = Path('apps/flutter/lib/ui/home_shell.dart')
          s = p.read_text()
          old = """                    onTap: () {
                      Navigator.of(context)
                          .push(MaterialPageRoute(
                              builder: (_) => ProjectDetailScreen(projectId: p.id)))
                          .then((_) {
                        AppDataBus.instance.lifeChanged();
                      });
                    },"""
          new = """                    onTap: () {
                      // ProjectDetailScreen publishes mutations via AppDataBus.
                      // Merely viewing should not force a Life reload on return.
                      Navigator.of(context).push(MaterialPageRoute(
                        builder: (_) => ProjectDetailScreen(projectId: p.id),
                      ));
                    },"""
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('home_shell project open fixed')
          else:
              print('pattern not found or already fixed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "chore: remove temp wave workflows; fix(phase-7): no forced life reload after project view" || echo nochange
          git push origin HEAD:chore/cleanup-temp-workflows
