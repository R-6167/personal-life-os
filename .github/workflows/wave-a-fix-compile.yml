name: WaveA fix compile errors
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase-2-milestone-deps-polish
      - name: Fix compile errors
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          pd = Path('apps/flutter/lib/ui/screens/project_detail_screen.dart')
          src = pd.read_text()
          src = src.replace(
              "AppDataBus.instance.publish(['projects', 'tasks']);",
              "AppDataBus.instance.lifeChanged();",
          )
          # Close asMap block correctly (was leftover map-arrow close)
          old = "                  )),\n\n            // \u2014\u2014 Tasks + subtasks \u2014\u2014"
          new = "                  );\n                  }),\n\n            // \u2014\u2014 Tasks + subtasks \u2014\u2014"
          if old in src:
              src = src.replace(old, new, 1)
          else:
              # ascii fallback
              old2 = "                  )),\n\n            // Tasks"
              # find line with )), before Tasks comment
              lines = src.splitlines(keepends=True)
              out = []
              fixed = False
              for i, line in enumerate(lines):
                  if (not fixed and line.strip() == ')),' and i + 2 < len(lines)
                      and 'Tasks' in lines[i + 2]):
                      out.append('                  );\n')
                      out.append('                  }),\n')
                      fixed = True
                  else:
                      out.append(line)
              if not fixed:
                  raise SystemExit('could not find )), close before Tasks')
              src = ''.join(out)
          if 'publish(' in src:
              raise SystemExit('publish still in project detail')
          if src.count('{') != src.count('}'):
              raise SystemExit(f"brace mismatch open={src.count('{')} close={src.count('}')}")
          pd.write_text(src)
          print('project_detail ok')

          td = Path('apps/flutter/lib/ui/screens/task_detail_screen.dart')
          tsrc = td.read_text()
          tsrc = tsrc.replace(
              "AppDataBus.instance.publish(['tasks']);",
              "AppDataBus.instance.tasksChanged();",
          )
          if 'publish(' in tsrc:
              raise SystemExit('publish still in task detail')
          td.write_text(tsrc)
          print('task_detail ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/ui/screens/project_detail_screen.dart apps/flutter/lib/ui/screens/task_detail_screen.dart
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "fix(phase-2): AppDataBus API + project_detail map brace close"
          git push origin HEAD:feat/phase-2-milestone-deps-polish
