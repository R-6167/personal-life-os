name: WaveB wire simple
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase-3-life-area-wiring
      - name: Patch hub models repos
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import urllib.request

          # Restore life_hub from main then patch
          hub_path = Path('apps/flutter/lib/ui/hubs/life_hub.dart')
          hs = urllib.request.urlopen(
              'https://raw.githubusercontent.com/R-6167/personal-life-os/main/apps/flutter/lib/ui/hubs/life_hub.dart'
          ).read().decode()
          if 'LifeAreasScreen' not in hs:
              hs = hs.replace(
                  "import '../screens/wellness_screen.dart';",
                  "import '../screens/life_areas_screen.dart';\nimport '../screens/wellness_screen.dart';",
              )
              insert = (
                  "_navCard(\n"
                  "            icon: Icons.category_outlined,\n"
                  "            title: 'Life areas',\n"
                  "            subtitle: 'Configure domains of life',\n"
                  "            onTap: () {\n"
                  "              Navigator.of(context).push(\n"
                  "                MaterialPageRoute(builder: (_) => const LifeAreasScreen()),\n"
                  "              );\n"
                  "            },\n"
                  "          ),\n"
                  "          "
              )
              idx = hs.find('icon: Icons.spa')
              if idx >= 0:
                  idx = hs.rfind('_navCard(', 0, idx)
              else:
                  idx = hs.find('_navCard(')
              assert idx >= 0, 'nav card not found'
              hs = hs[:idx] + insert + hs[idx:]
          hub_path.write_text(hs)
          print('hub ok', 'LifeAreasScreen' in hs)

          # Models: insert lifeAreaId fields with simple line ops
          mp = Path('apps/flutter/lib/domain/models.dart')
          lines = mp.read_text().splitlines(keepends=True)
          out = []
          i = 0
          while i < len(lines):
              line = lines[i]
              out.append(line)
              # Goal: after priority field declaration
              if line.strip() == 'final int priority;' and i > 0 and 'class Goal' in ''.join(lines[max(0,i-15):i]):
                  if 'lifeAreaId' not in ''.join(lines[i:i+5]):
                      out.append('  final String? lifeAreaId;\n')
              # Goal constructor after priority = 0
              if 'this.priority = 0,' in line and 'class Goal' in ''.join(lines[max(0,i-25):i]):
                  if 'lifeAreaId' not in ''.join(lines[i:i+5]):
                      out.append('    this.lifeAreaId,\n')
              i += 1
          text = ''.join(out)
          # Goal fromMap
          if "lifeAreaId: dbStrOrNull(m['life_area_id'])" not in text:
              text = text.replace(
                  "priority: dbIntOr(m['priority']),\n        createdAt: dbIntOr(m['created_at']),\n        updatedAt: dbIntOr(m['updated_at']),\n      );\n\n  /// Columns that exist in schema.sql only.",
                  "priority: dbIntOr(m['priority']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        createdAt: dbIntOr(m['created_at']),\n        updatedAt: dbIntOr(m['updated_at']),\n      );\n\n  /// Columns that exist in schema.sql only.",
                  1,
              )
              text = text.replace(
                  "'status': status,\n        'created_at': createdAt,\n        'updated_at': updatedAt,\n      };\n}\n\nclass Project",
                  "'status': status,\n        'life_area_id': lifeAreaId,\n        'created_at': createdAt,\n        'updated_at': updatedAt,\n      };\n}\n\nclass Project",
                  1,
              )

          # Project fields
          if 'class Project' in text and text.count('lifeAreaId') < 4:
              text = text.replace(
                  '''class Project {
  final String id;
  final String ownerId;
  final String? goalId;
  final String title;
  final String status;
  final int priority;
  final int createdAt;
  final int updatedAt;

  const Project({
    required this.id,
    required this.ownerId,
    this.goalId,
    required this.title,
    required this.status,
    this.priority = 0,
    required this.createdAt,
    required this.updatedAt,
  });''',
                  '''class Project {
  final String id;
  final String ownerId;
  final String? goalId;
  final String title;
  final String status;
  final int priority;
  final String? lifeAreaId;
  final int createdAt;
  final int updatedAt;

  const Project({
    required this.id,
    required this.ownerId,
    this.goalId,
    required this.title,
    required this.status,
    this.priority = 0,
    this.lifeAreaId,
    required this.createdAt,
    required this.updatedAt,
  });''',
                  1,
              )
              text = text.replace(
                  "goalId: dbStrOrNull(m['goal_id']),\n        title: dbStr(m['title']),\n        status: dbStr(m['status'], 'ACTIVE'),\n        priority: dbIntOr(m['priority']),\n        createdAt: dbIntOr(m['created_at']),\n        updatedAt: dbIntOr(m['updated_at']),\n      );\n\n  Map<String, Object?> toInsertMap() => {\n        'id': id,\n        'owner_id': ownerId,\n        'goal_id': goalId,\n        'title': title,\n        'status': status,\n        'created_at': createdAt,\n        'updated_at': updatedAt,\n      };\n}\n\nclass Milestone",
                  "goalId: dbStrOrNull(m['goal_id']),\n        title: dbStr(m['title']),\n        status: dbStr(m['status'], 'ACTIVE'),\n        priority: dbIntOr(m['priority']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        createdAt: dbIntOr(m['created_at']),\n        updatedAt: dbIntOr(m['updated_at']),\n      );\n\n  Map<String, Object?> toInsertMap() => {\n        'id': id,\n        'owner_id': ownerId,\n        'goal_id': goalId,\n        'title': title,\n        'status': status,\n        'life_area_id': lifeAreaId,\n        'created_at': createdAt,\n        'updated_at': updatedAt,\n      };\n}\n\nclass Milestone",
                  1,
              )

          # Task
          if "final String? lifeAreaId;" not in text.split('class Task')[1][:500]:
              text = text.replace(
                  '  final String? projectId;\n  final String? goalId;\n  final String title;',
                  '  final String? projectId;\n  final String? goalId;\n  final String? lifeAreaId;\n  final String title;',
                  1,
              )
              text = text.replace(
                  '    this.projectId,\n    this.goalId,\n    required this.title,',
                  '    this.projectId,\n    this.goalId,\n    this.lifeAreaId,\n    required this.title,',
                  1,
              )
              text = text.replace(
                  "goalId: dbStrOrNull(m['goal_id']),\n        title: dbStr(m['title']),",
                  "goalId: dbStrOrNull(m['goal_id']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        title: dbStr(m['title']),",
                  1,
              )
              text = text.replace(
                  "'goal_id': goalId,\n        'title': title,\n        'status': status,\n        'priority': priority,",
                  "'goal_id': goalId,\n        'life_area_id': lifeAreaId,\n        'title': title,\n        'status': status,\n        'priority': priority,",
                  1,
              )
          mp.write_text(text)
          print('models lifeAreaId count', text.count('lifeAreaId'))

          # Goal repo
          gr = Path('apps/flutter/lib/data/goal_repository.dart').read_text()
          if 'lifeAreaId' not in gr:
              gr = gr.replace(
                  'required String title, String? description, int? targetDate, int priority = 0',
                  'required String title, String? description, int? targetDate, int priority = 0, String? lifeAreaId',
              )
              gr = gr.replace(
                  'priority: priority,\n      createdAt: now,\n      updatedAt: now,\n    );',
                  'priority: priority,\n      lifeAreaId: lifeAreaId,\n      createdAt: now,\n      updatedAt: now,\n    );',
                  1,
              )
              Path('apps/flutter/lib/data/goal_repository.dart').write_text(gr)
              print('goal repo ok')

          # Project repo
          pr = Path('apps/flutter/lib/data/project_repository.dart').read_text()
          if 'lifeAreaId' not in pr:
              pr = pr.replace(
                  'required String title, String? description, String? goalId',
                  'required String title, String? description, String? goalId, String? lifeAreaId',
              )
              pr = pr.replace(
                  'goalId: goalId,\n      title: title.trim(),\n      status: EntityStatus.active,\n      createdAt: now,\n      updatedAt: now,\n    );',
                  'goalId: goalId,\n      title: title.trim(),\n      status: EntityStatus.active,\n      lifeAreaId: lifeAreaId,\n      createdAt: now,\n      updatedAt: now,\n    );',
                  1,
              )
              Path('apps/flutter/lib/data/project_repository.dart').write_text(pr)
              print('project repo ok')

          # Task repo
          tr = Path('apps/flutter/lib/data/task_repository.dart').read_text()
          if 'String? lifeAreaId' not in tr:
              tr = tr.replace(
                  'String? parentTaskId,\n    String? assistantActionPreview,',
                  'String? parentTaskId,\n    String? lifeAreaId,\n    String? assistantActionPreview,',
              )
              tr = tr.replace(
                  'goalId: goalId,\n      title: title,\n      status: status,\n      priority: priority,\n      dueAt: dueAt,\n      createdAt: now,\n      updatedAt: now,\n    );',
                  'goalId: goalId,\n      lifeAreaId: lifeAreaId,\n      title: title,\n      status: status,\n      priority: priority,\n      dueAt: dueAt,\n      createdAt: now,\n      updatedAt: now,\n    );',
                  1,
              )
              Path('apps/flutter/lib/data/task_repository.dart').write_text(tr)
              print('task repo ok')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --quiet && echo nochange && exit 0
          git commit -m "feat(phase-3): wire lifeAreaId models/repos + LifeHub entry"
          git push origin HEAD:feat/phase-3-life-area-wiring
