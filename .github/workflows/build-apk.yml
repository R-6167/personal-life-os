name: Manual APK Build

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" || true

      - name: Install npm dependencies
        run: npm install

      - name: Generate native Android project (Expo prebuild)
        run: |
          npx expo prebuild --platform android --clean
          echo "--- android tree ---"
          ls -la android || (echo "android/ missing after prebuild" && exit 1)
          ls -la android/app || true

      - name: Point Gradle at the Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            # setup-android default locations
            for d in "$HOME/Android/Sdk" /usr/local/lib/android/sdk "$HOME/.android/sdk"; do
              if [ -d "$d" ]; then SDK="$d"; break; fi
            done
          fi
          echo "Using SDK at: $SDK"
          echo "sdk.dir=$SDK" > android/local.properties
          cat android/local.properties
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build debug APK with Gradle
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: personal-life-os-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
