name: WaveB overview wire
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase-3-life-area-pickers
      - name: Add life area pickers
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          p = Path('apps/flutter/lib/ui/forms/create_forms.dart')
          s = p.read_text()

          if 'life_area_repository.dart' not in s:
              s = s.replace(
                  "import '../../data/goal_repository.dart';",
                  "import '../../data/goal_repository.dart';\nimport '../../data/life_area_repository.dart';",
              )

          old = (
              "    case AddKind.project:\n"
              "      return _simpleText(\n"
              "        context,\n"
              "        title: 'New project',\n"
              "        fields: const ['Title', 'Description (optional)'],\n"
              "        onSave: (v) async {\n"
              "          await ProjectRepository(AppDatabase.instance).create(title: v[0]);\n"
              "        },\n"
              "      );\n"
              "    case AddKind.goal:\n"
              "      return _simpleText(\n"
              "        context,\n"
              "        title: 'New goal',\n"
              "        fields: const ['Title', 'Description (optional)'],\n"
              "        onSave: (v) async {\n"
              "          await GoalRepository(AppDatabase.instance).create(title: v[0]);\n"
              "        },\n"
              "      );"
          )
          repl = (
              "    case AddKind.project:\n"
              "      return _entityWithLifeAreaForm(\n"
              "        context,\n"
              "        title: 'New project',\n"
              "        onSave: (title, description, lifeAreaId) async {\n"
              "          await ProjectRepository(AppDatabase.instance).create(\n"
              "            title: title,\n"
              "            description: description,\n"
              "            lifeAreaId: lifeAreaId,\n"
              "          );\n"
              "        },\n"
              "      );\n"
              "    case AddKind.goal:\n"
              "      return _entityWithLifeAreaForm(\n"
              "        context,\n"
              "        title: 'New goal',\n"
              "        onSave: (title, description, lifeAreaId) async {\n"
              "          await GoalRepository(AppDatabase.instance).create(\n"
              "            title: title,\n"
              "            description: description,\n"
              "            lifeAreaId: lifeAreaId,\n"
              "          );\n"
              "        },\n"
              "      );"
          )
          if old in s:
              s = s.replace(old, repl, 1)
              print('goal/project cases replaced')
          else:
              print('goal/project cases already updated or not found')

          if 'String? lifeAreaId;' not in s.split('_taskForm')[1][:800]:
              s = s.replace(
                  "Future<bool> _taskForm(BuildContext context) async {\n  final title = TextEditingController();\n  final desc = TextEditingController();\n  var priority = 0;\n  DateTime? due;",
                  "Future<bool> _taskForm(BuildContext context) async {\n  final title = TextEditingController();\n  final desc = TextEditingController();\n  var priority = 0;\n  DateTime? due;\n  String? lifeAreaId;\n  final areaRepo = LifeAreaRepository(AppDatabase.instance);\n  await areaRepo.seedDefaultsIfEmpty();\n  final areas = await areaRepo.listActive();",
              )
              s = s.replace(
                  "              DropdownButtonFormField<int>(\n                value: priority,\n                dropdownColor: AppTheme.metal,\n                decoration: const InputDecoration(labelText: 'Priority'),",
                  "              DropdownButtonFormField<String?>(\n                value: lifeAreaId,\n                dropdownColor: AppTheme.metal,\n                decoration: const InputDecoration(labelText: 'Life area (optional)'),\n                items: [\n                  const DropdownMenuItem(value: null, child: Text('None')),\n                  ...areas.map(\n                    (a) => DropdownMenuItem(value: a.id, child: Text(a.title)),\n                  ),\n                ],\n                onChanged: (v) => setLocal(() => lifeAreaId = v),\n              ),\n              const SizedBox(height: 8),\n              DropdownButtonFormField<int>(\n                value: priority,\n                dropdownColor: AppTheme.metal,\n                decoration: const InputDecoration(labelText: 'Priority'),",
                  1,
              )
              s = s.replace(
                  "  await TaskRepository(AppDatabase.instance).create(\n    title: title.text.trim(),\n    dueAt: dueMs,\n    priority: priority,\n    description: desc.text.trim().isEmpty ? null : desc.text.trim(),\n  );",
                  "  await TaskRepository(AppDatabase.instance).create(\n    title: title.text.trim(),\n    dueAt: dueMs,\n    priority: priority,\n    description: desc.text.trim().isEmpty ? null : desc.text.trim(),\n    lifeAreaId: lifeAreaId,\n  );",
                  1,
              )
              print('task form patched')

          if '_entityWithLifeAreaForm' not in s:
              helper_lines = [
                  '',
                  'Future<bool> _entityWithLifeAreaForm(',
                  '  BuildContext context, {',
                  '  required String title,',
                  '  required Future<void> Function(String title, String? description, String? lifeAreaId) onSave,',
                  '}) async {',
                  '  final titleCtrl = TextEditingController();',
                  '  final descCtrl = TextEditingController();',
                  '  String? lifeAreaId;',
                  '  final areaRepo = LifeAreaRepository(AppDatabase.instance);',
                  '  await areaRepo.seedDefaultsIfEmpty();',
                  '  final areas = await areaRepo.listActive();',
                  '',
                  '  final ok = await showDialog<bool>(',
                  '    context: context,',
                  '    builder: (ctx) => StatefulBuilder(',
                  '      builder: (ctx, setLocal) => AlertDialog(',
                  '        backgroundColor: AppTheme.metal,',
                  "        title: Text(title, style: const TextStyle(color: AppTheme.silver)),",
                  '        content: Column(',
                  '          mainAxisSize: MainAxisSize.min,',
                  '          children: [',
                  '            TextField(',
                  '              controller: titleCtrl,',
                  '              autofocus: true,',
                  '              style: const TextStyle(color: AppTheme.silver),',
                  "              decoration: const InputDecoration(labelText: 'Title'),",
                  '            ),',
                  '            const SizedBox(height: 8),',
                  '            TextField(',
                  '              controller: descCtrl,',
                  '              style: const TextStyle(color: AppTheme.silver),',
                  "              decoration: const InputDecoration(labelText: 'Description (optional)'),",
                  '            ),',
                  '            const SizedBox(height: 8),',
                  '            DropdownButtonFormField<String?>(',
                  '              value: lifeAreaId,',
                  '              dropdownColor: AppTheme.metal,',
                  "              decoration: const InputDecoration(labelText: 'Life area (optional)'),",
                  '              items: [',
                  "                const DropdownMenuItem(value: null, child: Text('None')),",
                  '                ...areas.map(',
                  '                  (a) => DropdownMenuItem(value: a.id, child: Text(a.title)),',
                  '                ),',
                  '              ],',
                  '              onChanged: (v) => setLocal(() => lifeAreaId = v),',
                  '            ),',
                  '          ],',
                  '        ),',
                  '        actions: [',
                  "          TextButton(onPressed: () => Navigator.pop(ctx, false), child: const Text('Cancel')),",
                  '          FilledButton(',
                  '            onPressed: () {',
                  '              if (titleCtrl.text.trim().isEmpty) return;',
                  '              Navigator.pop(ctx, true);',
                  '            },',
                  "            child: const Text('Save'),",
                  '          ),',
                  '        ],',
                  '      ),',
                  '    ),',
                  '  );',
                  '  if (ok != true) return false;',
                  '  final desc = descCtrl.text.trim();',
                  '  await onSave(',
                  '    titleCtrl.text.trim(),',
                  '    desc.isEmpty ? null : desc,',
                  '    lifeAreaId,',
                  '  );',
                  '  return true;',
                  '}',
                  '',
              ]
              s = s + '\n'.join(helper_lines)
              print('helper appended')

          p.write_text(s)
          print('done', '_entityWithLifeAreaForm' in s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/ui/forms/create_forms.dart
          git diff --cached --stat
          git commit -m "feat(phase-3): life area picker on goal/project/task create" || echo nochange
          git push origin HEAD:feat/phase-3-life-area-pickers
