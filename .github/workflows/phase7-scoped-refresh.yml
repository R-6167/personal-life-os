name: Phase7 scoped refresh
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/phase-7-refresh-v3
      - name: Dart-only phase-7 scoped navigation
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          hs = Path('apps/flutter/lib/ui/home_shell.dart')
          s = hs.read_text()
          old_hs = (
              "                    onTap: () {\n"
              "                      Navigator.of(context)\n"
              "                          .push(MaterialPageRoute(\n"
              "                              builder: (_) => ProjectDetailScreen(projectId: p.id)))\n"
              "                          .then((_) {\n"
              "                        AppDataBus.instance.lifeChanged();\n"
              "                      });\n"
              "                    },"
          )
          repl_hs = (
              "                    onTap: () {\n"
              "                      Navigator.of(context).push(MaterialPageRoute(\n"
              "                        builder: (_) => ProjectDetailScreen(projectId: p.id),\n"
              "                      ));\n"
              "                    },"
          )
          if old_hs in s:
              hs.write_text(s.replace(old_hs, repl_hs, 1))
              print('home_shell fixed')
          else:
              print('home_shell skip')

          pd = Path('apps/flutter/lib/ui/screens/project_detail_screen.dart')
          t = pd.read_text()
          if "import '../../services/app_data_bus.dart';" not in t:
              t = t.replace(
                  "import '../../services/project_workspace.dart';",
                  "import '../../services/app_data_bus.dart';\nimport '../../services/project_workspace.dart';",
              )
          if '_openTaskDetails' not in t:
              helpers = (
                  "  Future<void> _openGoalDetails(String goalId) async {\n"
                  "    final generationBefore = AppDataBus.instance.generation;\n"
                  "    await Navigator.of(context).push(\n"
                  "      MaterialPageRoute(builder: (_) => GoalDetailScreen(goalId: goalId)),\n"
                  "    );\n"
                  "    if (!mounted) return;\n"
                  "    if (AppDataBus.instance.generation != generationBefore) {\n"
                  "      await _load();\n"
                  "    }\n"
                  "  }\n\n"
                  "  Future<void> _openTaskDetails(String taskId) async {\n"
                  "    final generationBefore = AppDataBus.instance.generation;\n"
                  "    await Navigator.of(context).push(\n"
                  "      MaterialPageRoute(builder: (_) => TaskDetailScreen(taskId: taskId)),\n"
                  "    );\n"
                  "    if (!mounted) return;\n"
                  "    if (AppDataBus.instance.generation != generationBefore) {\n"
                  "      await _load();\n"
                  "    }\n"
                  "  }\n\n"
              )
              t = t.replace('  Future<void> _load() async {', helpers + '  Future<void> _load() async {', 1)

          for old, repl in [
              (
                  "                          onPressed: () {\n"
                  "                            Navigator.of(context)\n"
                  "                                .push(MaterialPageRoute(\n"
                  "                                    builder: (_) => TaskDetailScreen(taskId: ws.nextAction!.taskId)))\n"
                  "                                .then((_) => _load());\n"
                  "                          },",
                  "                          onPressed: () => _openTaskDetails(ws.nextAction!.taskId),",
              ),
              (
                  "                onTap: () {\n"
                  "                  Navigator.of(context).push(\n"
                  "                    MaterialPageRoute(builder: (_) => GoalDetailScreen(goalId: goalId)),\n"
                  "                  );\n"
                  "                },",
                  "                onTap: () => _openGoalDetails(goalId),",
              ),
              (
                  "                        onTap: () async {\n"
                  "                          await Navigator.of(context).push(\n"
                  "                            MaterialPageRoute(builder: (_) => TaskDetailScreen(taskId: id)),\n"
                  "                          );\n"
                  "                          await _load();\n"
                  "                        },",
                  "                        onTap: () => _openTaskDetails(id),",
              ),
              (
                  "                            onTap: () async {\n"
                  "                              await Navigator.of(context).push(\n"
                  "                                MaterialPageRoute(\n"
                  "                                    builder: (_) => TaskDetailScreen(taskId: dbStr(s['id']))),\n"
                  "                              );\n"
                  "                              await _load();\n"
                  "                            },",
                  "                            onTap: () => _openTaskDetails(dbStr(s['id'])),",
              ),
              (
                  "                      onTap: () {\n"
                  "                        Navigator.of(context)\n"
                  "                            .push(MaterialPageRoute(\n"
                  "                                builder: (_) => TaskDetailScreen(taskId: dbStr(t['id']))))\n"
                  "                            .then((_) => _load());\n"
                  "                      },",
                  "                      onTap: () => _openTaskDetails(dbStr(t['id'])),",
              ),
          ]:
              if old in t:
                  t = t.replace(old, repl, 1)
                  print('nav ok')
          pd.write_text(t)
          print('done', t.count('_openTaskDetails'), t.count('.then((_) => _load())'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/ui/home_shell.dart apps/flutter/lib/ui/screens/project_detail_screen.dart
          git commit -m "fix(phase-7): generation-gated project/task navigation" || echo nochange
          git push origin HEAD:fix/phase-7-refresh-v3
