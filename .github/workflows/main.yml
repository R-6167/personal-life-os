name: Manual APK Build

on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    env:
      ANDROID_HOME: /opt/android
      ANDROID_SDK_ROOT: /opt/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Generate Expo prebuild
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: personal-life-os-debug-apk
          path: ./mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Show build results
        run: ls -la android/app/build/outputs/apk/debug/ || echo "No APK found"
