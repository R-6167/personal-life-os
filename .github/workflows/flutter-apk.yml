name: Flutter APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter schema asset
        run: |
          test -s assets/schema.sql
          wc -l assets/schema.sql

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Sync Android platform files
        run: |
          set +e
          flutter create . \
            --project-name ordin \
            --org com.aetherion \
            --platforms=android
          CREATE_CODE=$?
          set -e
          echo "flutter create exit=$CREATE_CODE"
          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew missing after flutter create"
            exit 1
          fi
          chmod +x android/gradlew

          # Re-assert product identity (flutter create may reset some files)
          GRADLE=android/app/build.gradle
          if [ -f "$GRADLE" ]; then
            sed -i 's|namespace *= *"[^"]*"|namespace = "com.aetherion.ordin"|g' "$GRADLE"
            sed -i 's|applicationId *= *"[^"]*"|applicationId = "com.aetherion.ordin"|g' "$GRADLE"
          fi
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            sed -i 's|android:label="[^"]*"|android:label="Ordin"|g' "$MANIFEST"
            if ! grep -q POST_NOTIFICATIONS "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application|' "$MANIFEST"
            fi
            # Prefer custom Ordin icon if present
            if [ -f android/app/src/main/res/drawable/ic_launcher_ordin.xml ]; then
              sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher_ordin"|g' "$MANIFEST"
              sed -i 's|android:icon="@android:drawable/[^"]*"|android:icon="@drawable/ic_launcher_ordin"|g' "$MANIFEST"
              if grep -q 'android:roundIcon' "$MANIFEST"; then
                sed -i 's|android:roundIcon="[^"]*"|android:roundIcon="@drawable/ic_launcher_ordin"|g' "$MANIFEST"
              fi
            fi
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Sanitize Dart sources
        run: |
          find lib -name '*.dart' -exec perl -pi -e 's/\r//g' {} +
          find lib -name '*.dart' -exec perl -pi -e 's/(?<![A-Za-z])equired /required /g' {} +
          find lib -name '*.dart' -exec perl -pi -e 's/activeTrackColor:/activeColor:/g' {} +
          echo "Sanitized. Remaining equired (should be empty):"
          grep -Rn --include='*.dart' -P '(?<![A-Za-z])equired ' lib || true

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          CODE=${PIPESTATUS[0]}
          echo "analyze exit=$CODE"
          if [ "$CODE" != "0" ]; then
            echo "::error::flutter analyze failed — see log above"
            grep -E "error •|Error:" /tmp/analyze.txt || true
            exit "$CODE"
          fi

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ordin-flutter-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
