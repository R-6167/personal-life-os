name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure schema asset is current
        run: |
          mkdir -p assets
          cp ../../src/db/schema.sql assets/schema.sql
          test -s assets/schema.sql

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate complete Android platform
        run: |
          # Replace incomplete android/ with a full Flutter-generated tree.
          # Application id becomes com.personallifeos.personal_life_os
          rm -rf android ios linux macos web windows
          flutter create . \
            --project-name personal_life_os \
            --org com.personallifeos \
            --platforms=android
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-life-os-flutter-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
