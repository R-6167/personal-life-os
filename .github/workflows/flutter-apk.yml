name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter schema asset
        run: |
          test -s assets/schema.sql
          wc -l assets/schema.sql

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate complete Android platform
        run: |
          rm -rf android ios linux macos web windows
          flutter create . \
            --project-name personal_life_os \
            --org com.personallifeos \
            --platforms=android
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:personal_life_os/main.dart';

          void main() {
            testWidgets('app builds', (tester) async {
              expect(PersonalLifeOsApp, isNotNull);
            });
          }
          EOF
          test -f android/gradlew
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q POST_NOTIFICATIONS "$MANIFEST"; then
              sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application|' "$MANIFEST"
            fi
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          CODE=${PIPESTATUS[0]}
          echo "analyze exit=$CODE"
          if [ "$CODE" != "0" ]; then
            echo "::error::flutter analyze failed — see log above"
            grep -E "error •|Error:" /tmp/analyze.txt || true
            exit "$CODE"
          fi

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-life-os-flutter-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
