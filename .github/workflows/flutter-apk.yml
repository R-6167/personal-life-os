name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter schema asset
        run: |
          test -s assets/schema.sql
          wc -l assets/schema.sql

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate complete Android platform
        run: |
          rm -rf android ios linux macos web windows
          flutter create . \
            --project-name personal_life_os \
            --org com.personallifeos \
            --platforms=android
          # flutter create overwrites test; keep our smoke test
          cat > test/widget_test.dart <<'EOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:personal_life_os/main.dart';

          void main() {
            testWidgets('app builds', (tester) async {
              expect(PersonalLifeOsApp, isNotNull);
            });
          }
          EOF
          test -f android/gradlew

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-life-os-flutter-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
