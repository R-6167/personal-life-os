name: Flutter APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/flutter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter schema asset
        run: |
          test -s assets/schema.sql
          wc -l assets/schema.sql

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Verify committed Android platform
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test ! -f android/gradlew
          echo "Using the committed Android project; no flutter create regeneration is permitted."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.3"

      - name: Get dependencies
        run: flutter pub get


      - name: Unit & smoke tests
        run: flutter test --reporter expanded

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/analyze.txt
          CODE=${PIPESTATUS[0]}
          echo "analyze exit=$CODE"
          if [ "$CODE" != "0" ]; then
            echo "::error::flutter analyze failed — see log above"
            grep -E "error •|Error:" /tmp/analyze.txt || true
            exit "$CODE"
          fi

      - name: Build release APK
        run: gradle --no-daemon -p android assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ordin-flutter-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
