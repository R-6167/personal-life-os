name: Flutter APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure schema asset is current
        run: |
          mkdir -p assets
          cp ../../src/db/schema.sql assets/schema.sql
          wc -l assets/schema.sql

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Write android/local.properties
        run: |
          # settings.gradle requires flutter.sdk (machine-local file, not in git)
          test -n "$FLUTTER_ROOT" || { echo "FLUTTER_ROOT not set"; exit 1; }
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "flutter.buildMode=release"
            echo "flutter.versionName=0.1.0"
            echo "flutter.versionCode=1"
          } > android/local.properties
          cat android/local.properties

      - name: Require android/ project
        run: |
          test -f android/app/build.gradle || {
            echo "::error::apps/flutter/android incomplete"
            exit 1
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure platform files (non-destructive)
        run: |
          # Fills any missing Gradle wrapper / plugin registrant without wiping custom files
          flutter create . --project-name personal_life_os --org com.personallifeos --platforms=android

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-life-os-flutter-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
