name: Fix migrate v26 method
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Apply fix on feature branch
        run: |
          set -euo pipefail
          git fetch origin fix/life-screens-and-notes
          git checkout fix/life-screens-and-notes
          # ensure script available from main
          git checkout main -- tools/fix_migrate_v26.py
          python3 tools/fix_migrate_v26.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/data/database.dart
          git commit -m "fix: define _migrateToV26 wellness tables method" || echo nochange
          git push origin HEAD:fix/life-screens-and-notes
