name: EAS APK Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (preview = installable APK for your phone)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - development
          - production

jobs:
  build-android:
    name: Build Android (${{ inputs.profile }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing EXPO_TOKEN secret."
            echo "1. Create a token at https://expo.dev/settings/access-tokens"
            echo "2. GitHub → Settings → Secrets and variables → Actions → New secret"
            echo "   Name: EXPO_TOKEN"
            exit 1
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Check EAS project is linked
        run: |
          if ! grep -q 'projectId' app.json app.config.js app.config.ts 2>/dev/null; then
            echo "::error::No EAS projectId in app config yet."
            echo "On your computer (no Android Studio needed):"
            echo "  cd mobile && npm install -g eas-cli"
            echo "  eas login"
            echo "  eas build:configure"
            echo "  eas build --platform android --profile preview"
            echo "Commit the updated app.json, then re-run this workflow."
            exit 1
          fi

      - name: Trigger EAS Build (Android)
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait

      - name: Where to get the APK
        run: |
          echo "Build queued on Expo cloud (no Android Studio)."
          echo "Download the APK on your phone from: https://expo.dev → Builds"
