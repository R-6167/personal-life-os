name: WaveB fix PR35 compile
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/phase-3-life-area-wiring
      - name: Fix models and life_hub
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import urllib.request

          # Fix models: remove duplicate lifeAreaId in Project.fromMap; add to Task.fromMap
          mp = Path('apps/flutter/lib/domain/models.dart')
          m = mp.read_text()
          m = m.replace(
              """        goalId: dbStrOrNull(m['goal_id']),
        lifeAreaId: dbStrOrNull(m['life_area_id']),
        title: dbStr(m['title']),
        status: dbStr(m['status'], 'ACTIVE'),
        priority: dbIntOr(m['priority']),
        lifeAreaId: dbStrOrNull(m['life_area_id']),
        createdAt: dbIntOr(m['created_at']),
        updatedAt: dbIntOr(m['updated_at']),
      );

  Map<String, Object?> toInsertMap() => {
        'id': id,
        'owner_id': ownerId,
        'goal_id': goalId,
        'title': title,
        'status': status,
        'life_area_id': lifeAreaId,
""",
              """        goalId: dbStrOrNull(m['goal_id']),
        title: dbStr(m['title']),
        status: dbStr(m['status'], 'ACTIVE'),
        priority: dbIntOr(m['priority']),
        lifeAreaId: dbStrOrNull(m['life_area_id']),
        createdAt: dbIntOr(m['created_at']),
        updatedAt: dbIntOr(m['updated_at']),
      );

  Map<String, Object?> toInsertMap() => {
        'id': id,
        'owner_id': ownerId,
        'goal_id': goalId,
        'title': title,
        'status': status,
        'life_area_id': lifeAreaId,
""",
              1,
          )
          # Task.fromMap: add lifeAreaId after goalId
          if "goalId: dbStrOrNull(m['goal_id']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        title: dbStr(m['title'])," not in m:
              m = m.replace(
                  "projectId: dbStrOrNull(m['project_id']),\n        goalId: dbStrOrNull(m['goal_id']),\n        title: dbStr(m['title']),",
                  "projectId: dbStrOrNull(m['project_id']),\n        goalId: dbStrOrNull(m['goal_id']),\n        lifeAreaId: dbStrOrNull(m['life_area_id']),\n        title: dbStr(m['title']),",
                  1,
              )
          mp.write_text(m)
          # sanity: Project.fromMap should have lifeAreaId once
          proj = m.split('class Project')[1].split('class Milestone')[0]
          assert proj.count("lifeAreaId: dbStrOrNull") == 1, proj.count("lifeAreaId: dbStrOrNull")
          print('models fixed')

          # Restore life_hub from main and insert Life Areas card correctly in children
          hub = Path('apps/flutter/lib/ui/hubs/life_hub.dart')
          hs = urllib.request.urlopen(
              'https://raw.githubusercontent.com/R-6167/personal-life-os/main/apps/flutter/lib/ui/hubs/life_hub.dart'
          ).read().decode()
          if "import '../screens/life_areas_screen.dart';" not in hs:
              hs = hs.replace(
                  "import '../screens/wellness_screen.dart';",
                  "import '../screens/life_areas_screen.dart';\nimport '../screens/wellness_screen.dart';",
              )
          card = """        _navCard(
          icon: Icons.category_outlined,
          title: 'Life areas',
          subtitle: 'Configure domains of life',
          onTap: () {
            Navigator.of(context).push(
              MaterialPageRoute(builder: (_) => const LifeAreasScreen()),
            );
          },
        ),
"""
          if 'LifeAreasScreen' not in hs or 'Icons.category_outlined' not in hs:
              # Insert as first child in the ListView children list (after children: [)
              marker = "      children: [\n        _navCard(\n          icon: Icons.priority_high,"
              if marker not in hs:
                  raise SystemExit('children marker not found')
              hs = hs.replace(
                  marker,
                  "      children: [\n" + card + "        _navCard(\n          icon: Icons.priority_high,",
                  1,
              )
          # Ensure method _navCard is intact
          assert hs.count('Widget _navCard(') == 1
          assert 'Icons.category_outlined' in hs
          hub.write_text(hs)
          print('hub fixed', len(hs))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/lib/domain/models.dart apps/flutter/lib/ui/hubs/life_hub.dart
          git diff --cached --stat
          git commit -m "fix(phase-3): models lifeAreaId dup + restore LifeHub nav card"
          git push origin HEAD:feat/phase-3-life-area-wiring
