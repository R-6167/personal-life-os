name: Generate pubspec.lock

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to verify pubspec.lock on
        required: true
        default: main

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Enforce committed lockfile
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          test -s pubspec.lock
          flutter pub get --enforce-lockfile
          echo "pubspec.lock is present and enforced"
