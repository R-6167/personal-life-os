name: Generate pubspec.lock

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to update with pubspec.lock
        required: true
        default: main
      regenerate:
        description: "true = refresh lock from pubspec.yaml; false = enforce existing lock"
        required: true
        default: "false"

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Sync lockfile
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          test -s pubspec.lock
          if [ "${{ github.event.inputs.regenerate }}" = "true" ]; then
            # Intentional unlock only when operator requests a lock refresh after pubspec.yaml changes.
            flutter pub get
          else
            flutter pub get --enforce-lockfile
          fi
          test -s pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock already up to date"
            exit 0
          fi
          git commit -m "security: update pubspec.lock"
          git push origin "HEAD:${{ github.event.inputs.target_branch }}"
