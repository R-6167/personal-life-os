name: ordin
description: Ordin — offline personal life OS. Material 3 glass, local intelligence, local SQLite.
publish_to: "none"
version: 0.19.0+25

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  crypto: ^3.0.5
  cryptography: ^2.7.0
  encrypt: ^5.0.3
  # On-device GGUF via llama.cpp (Android/iOS)
  llama_flutter_android: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
