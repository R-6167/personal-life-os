name: personal_life_os
description: Offline Personal Life OS — Material 3 glass, local intelligence, local SQLite.
publish_to: "none"
version: 0.14.0+18

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  crypto: ^3.0.5
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/schema.sql
