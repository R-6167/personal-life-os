pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(rootDir.absolutePath + "/local.properties")
        if (propertiesFile.exists()) {
            properties.load(propertiesFile.newInputStream())
        }
        properties.getProperty("flutter.sdk")
    }()

    if (flutterSdkPath == null || flutterSdkPath.isEmpty()) {
        throw new GradleException(
            "flutter.sdk not set in local.properties. " +
            "Set it to the Flutter SDK directory."
        )
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.7.10" apply false
}

include ":app"

rootProject.name = "personal_life_os"
